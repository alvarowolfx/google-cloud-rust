[package]
name                 = "demo-polars-bigquery"
version              = "0.0.0"
publish              = false
description          = "BigQuery I/O Plugin for Polars using Arrow C Stream FFI and Storage Read API"
edition.workspace    = true
authors.workspace    = true
license.workspace    = true
repository.workspace = true

[lib]
name       = "_polars_bigquery"
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace      = true
arrow                 = { workspace = true, features = ["ffi", "ipc", "ipc_compression"] }
google-cloud-auth     = { workspace = true, features = ["default"] }
google-cloud-bigquery = { workspace = true, features = ["default"] }
google-cloud-gax      = { workspace = true, features = ["unstable-stream"] }
http.workspace        = true
pyo3                  = { version = "0.23", features = ["extension-module", "abi3-py39"] }
tokio                 = { workspace = true, features = ["rt-multi-thread", "sync"] }

[lints]
workspace = true
